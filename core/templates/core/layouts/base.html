<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chiyasan{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef7ee',
                            100: '#fdedd3',
                            200: '#f9d7a5',
                            300: '#f5b96d',
                            400: '#f09333',
                            500: '#ec7a12',
                            600: '#dd5f08',
                            700: '#b74709',
                            800: '#92380f',
                            900: '#763010',
                        },
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-stone-50 text-stone-800 font-sans antialiased">
    {% include "core/includes/navbar.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "core/includes/footer.html" %}

    {% block extra_js %}{% endblock %}
</body>
</html>
